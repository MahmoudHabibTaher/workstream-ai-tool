name = "claude-code"
label = "Claude Code"
instructions = "CLAUDE.md"
skill = ".claude/skills/{name}/SKILL.md"

[worker]
path = ".claude/agents/ws-worker.md"
name = "ws-worker"
description = "Does one workstream task by following `ws brief`."
# The whole list, so a worker can't start workers of its own.
frontmatter = "tools: Read, Edit, Write, Bash, Grep, Glob"
# Refused in the background even with an allow rule, so `ws brief` warns instead of a worker trying.
cannot_edit = [".claude/"]
# Rules for this agent's workers only. `ws brief` labels them with the agent, and the worker file
# carries them too. A background worker here can't ask permission, so anything but an edit tool
# or a single shell command the settings allow is refused.
rules = ["Create and change files with your edit tools, and give the shell one command per call: a background worker can't ask permission for anything else. A denied call isn't a block until you've tried it that way."]

[notes]
ws-plan = "Do steps 1 to 5 in plan mode, and ask with the question tool. The plan file you write there is what `ws seed --from-plan` reads."
ws-run = "Start each worker with the Agent tool: `subagent_type: \"{worker}\"`, in the background, with no `isolation` setting. `ws worktree create` already made a worktree from the claim commit, and built-in isolation would start from the default branch. Run this skill from the main session, and you are notified as each finishes."

[settings]
path = ".claude/settings.json"
# What a background worker needs without stopping to ask. Never a push.
allow = ["Bash(ws *)", "Bash(git add *)", "Bash(git commit *)", "Bash(git status*)", "Bash(git branch --show-current)", "Bash(git diff*)", "Bash(git log*)", "Bash(git switch *)"]
# One rule per command in the project's [commands].
command_rule = "Bash({}*)"
# `ws verify` on a real project outlasts the default limit, and a worker that backgrounds it to get
# past that limit ends its turn with the check still running. A headless run also stops its workers
# 10 minutes after the coordinator's last turn unless told to wait, and a real task takes longer.
env = { BASH_MAX_TIMEOUT_MS = "3600000", CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "0" }

[hook]
command = "ws hook pre-edit --format exit-code"
event = "PreToolUse"
matcher = "Edit|Write|MultiEdit|NotebookEdit"
# Merged into [settings] path. A plugin writes the same thing to its own file.
plugin_file = "hooks/hooks.json"

[plugin]
name = "workstream"
description = "Run large bodies of work as a task graph in your repo."
manifest = ".claude-plugin/plugin.json"
skill = "skills/{name}/SKILL.md"
worker = "agents/ws-worker.md"
worker_name = "workstream:ws-worker"

[transcripts]
# Read by `ws audit usage`. Numbers come out, and nothing else.
root = "~/.claude/projects"
reader = "message-lines"
