name = "copilot-cli"
label = "Copilot CLI"
instructions = ".github/copilot-instructions.md"
skill = ".github/skills/{name}/SKILL.md"

[worker]
path = ".github/agents/ws-worker.agent.md"
name = "ws-worker"
description = "Does one workstream task by following `ws brief`."
# Subagents skip custom instructions by default, and may need the project's own rules. The list
# leaves out the task tool, so a worker can't start workers of its own.
frontmatter = "tools: [\"read\", \"grep\", \"glob\", \"edit\", \"execute\"]\nstrict-tools-list: true\ninclude-custom-instructions: true"

[notes]
ws-plan = "Ask with the question tool, one at a time. The plan file you write is what `ws seed --from-plan` reads."
ws-run = "Start each worker with the `task` tool: agent type `{worker}`, `mode: background`, and `model` set to the model you are running as, because a default may be weaker. Each runs in a worktree `ws worktree create` already made. You are notified as each finishes; read its result once."

[hook]
command = "ws hook pre-edit --format json"
# A whole file of its own, in this agent's format. It denies on any crash, so a short timeout
# (which fails open) is the safe side.
file = ".github/hooks/ws.json"
file_content = """{
  "version": 1,
  "hooks": {
    "preToolUse": [
      {
        "type": "command",
        "matcher": "edit|create|str_replace_editor|apply_patch",
        "bash": "ws hook pre-edit --format json",
        "timeoutSec": 10
      }
    ]
  }
}
"""

[transcripts]
# Read by `ws audit usage`. Numbers come out, and nothing else.
root = "~/.copilot/session-state"
reader = "event-lines"

[launch]
# How `ws launch argv` starts this agent in a terminal, read from `copilot --help` (1.0.108).
command = "copilot"
# `-i <prompt>` starts interactive mode and runs the prompt; `-p` would exit after it.
prompt = "flag"
prompt_flag = "-i"
effort_flag = "--reasoning-effort"
# The help says the levels a model supports depend on the model.
effort_levels = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

# Each choice a picker offers, and the flags it adds. No choice adds nothing: the agent asks.
[launch.permissions]
allow-all-tools = ["--allow-all-tools"]
allow-all = ["--allow-all"]
