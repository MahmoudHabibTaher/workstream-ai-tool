# The plugin runs on the IDE's own Kotlin stdlib and coroutines, so it ships neither (plan T9).
kotlin.stdlib.default.dependency=false
# The JetBrains Runtime 25 toolchain (build.gradle.kts) is found among the installed JDKs, never
# downloaded. To point at one Gradle can't find, set org.gradle.java.installations.paths in
# ~/.gradle/gradle.properties.
org.gradle.java.installations.auto-download=false
org.gradle.jvmargs=-Xmx2g
