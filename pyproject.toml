[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workstream"
version = "0.1.0"
description = "Run large bodies of work with coding agents: a task graph in your repo, verified by commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ws = "workstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workstream = ["templates/*.md", "assets/*.md", "assets/skills/*/*.md", "assets/profiles/*.toml"]
